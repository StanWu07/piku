<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Piku · 日常助手</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="compact-header"><strong class="wordmark">piku</strong><nav><button data-page="tasks">待办 <span id="nav-count">0</span></button><button data-page="settings">设置</button><details class="more-menu"><summary>更多</summary><div><button data-page="actions">助手建议 <span id="action-count">0</span></button><button data-command="paste">粘贴消息 ↗</button><button data-page="history">活动记录</button></div></details></nav></header>
    <span id="breadcrumb" hidden></span><span id="connection" hidden></span>
    <div id="content"><p class="loading">正在读取待办…</p></div>
  </main>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
